# Runs the mypy pre-commit hook, which pre-commit.ci skips: the hook
# runs mypy from the uv project environment, and pre-commit.ci is
# offline and cannot build it. No path filter, so the job can become a
# required check without blocking pull requests it would skip.
name: "Type check 🔎"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  mypy:
    name: "mypy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # It includes the PyPI endpoints uv needs.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@8a6861932198174753dc85d679445d39e33c3138  # v0.15.1
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The action checks out the repository itself, with
      # persist-credentials: false.
      - name: 'Run the mypy hook'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/standalone-linting-action@a00b2febdcb6da5332f77e829dfdc131a91b8fce  # v0.10.1
        with:
          hooks: 'mypy'
