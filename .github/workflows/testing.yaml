---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'Test GitHub2Gerrit 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'
      # Re-include the workflows this suite guards: the reusable
      # workflow smoke test must run when the workflow plumbing
      # changes (the v1.4.2 regression shipped in a workflow-only
      # change that never triggered this suite)
      - '.github/workflows/github2gerrit.yaml'
      - '.github/workflows/testing.yaml'

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the reusable workflow path used by production callers ###
  # This exercises the workflow_call plumbing that the composite
  # action tests below cannot reach: the bundled-action checkout and
  # the workflow source repository resolution from the job context.
  # Runs on every trigger event (pull_request, push, workflow_dispatch
  # and schedule) so all supported caller invocation modes get
  # coverage; schedule exercises the scheduled sweep. G2G_NO_GERRIT
  # keeps the run hermetic: no Gerrit server access takes place.
  reusable-workflow-test:
    name: 'Test Reusable Workflow'
    permissions:
      contents: read  # Checkout for the mirror job and bundled action
      pull-requests: write  # Comment on and update mirrored PRs
      issues: write  # Post status/back-reference comments on issues
    uses: $/.github/workflows/github2gerrit.yaml
    with:
      G2G_NO_GERRIT: true
      AUTOMATION_ONLY: false
      GERRIT_KNOWN_HOSTS: 'dummy-host ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...'
    secrets:
      GERRIT_SSH_PRIVKEY_G2G: 'dummy-key'

  ### Test the GitHub Action in this Repository (PR context only) ###
  tests:
    name: 'Test GitHub Action'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    # Only run on pull requests - action needs PR context
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Running local action: ${{ github.repository }}"
        uses: $/
        with:
          GERRIT_KNOWN_HOSTS: 'dummy-host ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...'
          GERRIT_SSH_PRIVKEY_G2G: 'dummy-key'
          G2G_NO_GERRIT: 'true'
          AUTOMATION_ONLY: 'false'

      # yamllint disable-line rule:line-length
      - name: "Running local action: ${{ github.repository }} [Failure]"
        uses: $/
        id: failure
        continue-on-error: true
        env:
          G2G_DRYRUN_DISABLE_NETWORK: 'true'
          G2G_ENABLE_DERIVATION: 'false'
        with:
          GERRIT_KNOWN_HOSTS: "dummy-host ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC..."
          GERRIT_SSH_PRIVKEY_G2G: ""
          DRY_RUN: 'true'
          AUTOMATION_ONLY: 'false'

      # Failure testing is also important.
      #
      # Skipped for pull requests raised from a fork: the approval gate
      # stops those before input validation is reached, so the step
      # above exits successfully having transferred nothing. That is
      # the gate working, not the failure case under test.
      - name: "Error if step above did NOT fail"
        # yamllint disable-line rule:line-length
        if: steps.failure.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1

  ### Run the CLI against LF Gerrit's sandbox project ###
  # Transfers an open Dependabot pull request from lfit/sandbox, first
  # in dry-run and then live, with Gerrit REST authenticated. There is
  # no job running the composite action against live Gerrit: the action
  # takes its pull request from this repository's event and token, so
  # it cannot target lfit/sandbox. The jobs above cover the action
  # under G2G_NO_GERRIT.
  cli-integration-test:
    name: 'CLI Integration Test'
    runs-on: 'ubuntu-latest'
    # GERRIT_SSH_PRIVKEY_G2G, GERRIT_HTTP_PASSWORD and
    # READ_ONLY_GITHUB_TOKEN are repository secrets, not secrets of this
    # environment, so the environment does not limit which jobs can
    # read them.
    environment: 'development'
    permissions:
      contents: read
    timeout-minutes: 15
    # Only run on workflow_dispatch or push to main - tests CLI not action
    # yamllint disable-line rule:line-length
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup Python'
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: 'pyproject.toml'

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          ignore-empty-workdir: true

      - name: 'Select sandbox pull request'
        id: select-pr
        shell: bash
        env:
          # Cross-repository read access to lfit/sandbox; the default
          # github.token only covers this repository
          GH_TOKEN: "${{ secrets.READ_ONLY_GITHUB_TOKEN }}"
          SANDBOX_REPOSITORY: 'lfit/sandbox'
          # Optional overrides naming the pull request for the dry-run
          # and the live step; a closed one fails that step
          VARS_DEPENDABOT_PR_URL_1: ${{ vars.DEPENDABOT_PR_URL_1 }}
          VARS_DEPENDABOT_PR_URL_2: ${{ vars.DEPENDABOT_PR_URL_2 }}
        run: |
          # Select an open Dependabot pull request in the sandbox
          set -euo pipefail
          selected=""
          if [[ -z "${VARS_DEPENDABOT_PR_URL_1:-}" \
            || -z "${VARS_DEPENDABOT_PR_URL_2:-}" ]]; then
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "::error::READ_ONLY_GITHUB_TOKEN is not set;" \
                "cannot list pull requests in ${SANDBOX_REPOSITORY}"
              exit 1
            fi
            selected="$(gh pr list --repo "${SANDBOX_REPOSITORY}" \
              --author 'app/dependabot' --state open --limit 1 \
              --json url --jq '.[0].url // ""')"
            if [[ -z "${selected}" ]]; then
              echo "::error::No open app/dependabot pull request in" \
                "${SANDBOX_REPOSITORY}. Open one there, or set the" \
                "DEPENDABOT_PR_URL_1 and DEPENDABOT_PR_URL_2 variables" \
                "to open pull requests."
              exit 1
            fi
          fi
          dry_run_url="${VARS_DEPENDABOT_PR_URL_1:-${selected}}"
          live_url="${VARS_DEPENDABOT_PR_URL_2:-${selected}}"
          pattern="^https://github\.com/${SANDBOX_REPOSITORY}/pull/[1-9][0-9]*$"
          for url in "${dry_run_url}" "${live_url}"; do
            if ! [[ "${url}" =~ ${pattern} ]]; then
              echo "::error::Not a ${SANDBOX_REPOSITORY} pull request URL: ${url}"
              exit 1
            fi
          done
          echo "Dry-run pull request: ${dry_run_url}"
          echo "Live pull request: ${live_url}"
          {
            echo "dry_run_url=${dry_run_url}"
            echo "live_url=${live_url}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Test CLI integration with Gerrit [Dry Run]'
        shell: bash
        env:
          # Cross-repository read access to lfit/sandbox; the default
          # github.token only covers this repository
          GITHUB_TOKEN: "${{ secrets.READ_ONLY_GITHUB_TOKEN }}"
          # Gerrit configuration
          GERRIT_KNOWN_HOSTS: "${{ vars.GERRIT_KNOWN_HOSTS }}"
          GERRIT_SSH_PRIVKEY_G2G: "${{ secrets.GERRIT_SSH_PRIVKEY_G2G }}"
          GERRIT_SSH_USER_G2G: 'modesevenindustrialsolutions'
          GERRIT_SSH_USER_G2G_EMAIL: 'mwatkins@linuxfoundation.org'
          GERRIT_HTTP_USER: 'modesevenindustrialsolutions'
          GERRIT_HTTP_PASSWORD: "${{ secrets.GERRIT_HTTP_PASSWORD }}"
          GERRIT_SERVER: 'gerrit.linuxfoundation.org'
          GERRIT_PROJECT: 'sandbox'
          GERRIT_SERVER_PORT: '29418'
          DRY_RUN: 'true'
          G2G_ENABLE_DERIVATION: 'false'
          ALLOW_DUPLICATES: 'true'
          PRESERVE_GITHUB_PRS: 'true'
          G2G_VERBOSE: 'true'
          FETCH_DEPTH: '50'
          USE_PR_AS_COMMIT: 'true'
          PR_URL: ${{ steps.select-pr.outputs.dry_run_url }}
          # lfit/sandbox has correct .gitreview pointing to LF Gerrit
        run: |
          # Dry-run the single-PR path with Gerrit REST authenticated
          set -euo pipefail
          echo "Testing GitHub2Gerrit CLI integration with LF Gerrit server..."
          echo "Target PR: ${PR_URL}"

          # Without a password the tool falls back to anonymous REST,
          # which would leave the authenticated path untested
          if [[ -z "${GERRIT_HTTP_PASSWORD:-}" ]]; then
            echo "::error::GERRIT_HTTP_PASSWORD secret is not set"
            exit 1
          fi

          # Install current code in development mode and test CLI directly
          echo "Installing current code: uv pip install --system -e ."
          uv pip install --system -e .

          # A step cannot override the runner's GITHUB_EVENT_NAME and
          # GITHUB_EVENT_PATH through env:, so they are set here, for
          # the CLI alone; a push then takes the same single-PR path as
          # a dispatch rather than the merged-PR cleanup path.
          log="${RUNNER_TEMP}/g2g-dry-run.log"
          echo "Running: python -m github2gerrit.cli ${PR_URL}"
          GITHUB_EVENT_NAME=workflow_dispatch GITHUB_EVENT_PATH='' \
            python -m github2gerrit.cli "${PR_URL}" 2>&1 | tee "${log}"

          if ! grep -qF "Gerrit REST authenticated access verified" "${log}"; then
            echo "::error::Gerrit REST authentication was not verified"
            exit 1
          fi
          if grep -qF "(auth_user=)" "${log}"; then
            echo "::error::A Gerrit REST call ran anonymously"
            exit 1
          fi

          echo "✅ Dry-run CLI integration test passed"
          {
            echo "CLI Integration test summary:"
            echo "- Tested with external PR: ${PR_URL}"
            echo "- Target Gerrit: gerrit.linuxfoundation.org"
            echo "- Target Project: sandbox"
            echo "- Mode: DRY_RUN (validation only)"
            echo "- Gerrit REST: authenticated as ${GERRIT_HTTP_USER}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Test CLI Error Handling (Expected Failure)'
        id: expected-failure
        continue-on-error: true
        shell: bash
        env:
          # Use invalid token to force GitHub API failure
          GITHUB_TOKEN: "invalid_token_12345"
          GERRIT_KNOWN_HOSTS: "${{ vars.GERRIT_KNOWN_HOSTS }}"
          GERRIT_SSH_PRIVKEY_G2G: "${{ secrets.GERRIT_SSH_PRIVKEY_G2G }}"
          DRY_RUN: 'true'
          CLOSE_MERGED_PRS: 'false'
          SYNC_ALL_OPEN_PRS: 'false'
          PR_URL: ${{ steps.select-pr.outputs.dry_run_url }}
        run: |
          echo "Testing GitHub API error handling with invalid token..."
          echo "Target PR: ${PR_URL}"

          # Capture exit code. The event is set for the CLI alone, as
          # in the dry-run step, so the tool enters the single-PR path
          # where an invalid token surfaces as exit code 4.
          EXIT_CODE=0
          GITHUB_EVENT_NAME=workflow_dispatch GITHUB_EVENT_PATH='' \
            python -m github2gerrit.cli "${PR_URL}" || EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          # Should fail with exit code 4 (GITHUB_API_ERROR)
          if [ "$EXIT_CODE" -eq 4 ]; then
            echo "✅ CLI failed with correct exit code: $EXIT_CODE"
          else
            echo "❌ Expected exit code 4, got: $EXIT_CODE"
            exit 1
          fi

      - name: 'Verify Error Handling'
        shell: bash
        run: |
          if [ "${EXIT_CODE}" -eq 4 ] 2>/dev/null; then
            echo "✅ GitHub API error handling working correctly"
            echo "## Error Handling Test ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "- CLI properly handles GitHub API errors with exit code 4" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Error handling failed (exit code: ${EXIT_CODE})"
            exit 1
          fi

      - name: "Test CLI integration with Gerrit"
        shell: bash
        env:
          # Cross-repository read access to lfit/sandbox; the default
          # github.token only covers this repository
          GITHUB_TOKEN: "${{ secrets.READ_ONLY_GITHUB_TOKEN }}"
          # Gerrit configuration - force override of .gitreview
          GERRIT_KNOWN_HOSTS: "${{ vars.GERRIT_KNOWN_HOSTS }}"
          GERRIT_SSH_PRIVKEY_G2G: "${{ secrets.GERRIT_SSH_PRIVKEY_G2G }}"
          GERRIT_SSH_USER_G2G: 'modesevenindustrialsolutions'
          GERRIT_SSH_USER_G2G_EMAIL: 'mwatkins@linuxfoundation.org'
          GERRIT_HTTP_USER: 'modesevenindustrialsolutions'
          GERRIT_HTTP_PASSWORD: "${{ secrets.GERRIT_HTTP_PASSWORD }}"
          GERRIT_SERVER: 'gerrit.linuxfoundation.org'
          GERRIT_PROJECT: 'sandbox'
          GERRIT_SERVER_PORT: '29418'
          DRY_RUN: 'false'
          G2G_ENABLE_DERIVATION: 'false'
          ALLOW_DUPLICATES: 'true'
          PRESERVE_GITHUB_PRS: 'true'
          G2G_VERBOSE: 'true'
          FETCH_DEPTH: '50'
          USE_PR_AS_COMMIT: 'true'
          PR_URL: ${{ steps.select-pr.outputs.live_url }}
          # lfit/sandbox has correct .gitreview pointing to LF Gerrit
          # Force derivation to be disabled so our overrides take precedence
        run: |
          # Push the pull request to Gerrit with REST authenticated
          set -euo pipefail
          echo '🚀 Integration Test Summary'
          echo "Target PR: ${PR_URL}"

          if [[ -z "${GERRIT_HTTP_PASSWORD:-}" ]]; then
            echo "::error::GERRIT_HTTP_PASSWORD secret is not set"
            exit 1
          fi

          # Configure git with your identity
          # Gerrit private SSH key is linked to this account
          git config --global user.name "$GERRIT_SSH_USER_G2G"
          git config --global user.email "$GERRIT_SSH_USER_G2G_EMAIL"

          # The CLI writes its outputs here; read them back to confirm
          # the push produced a change, rather than taking a zero exit
          # code as proof of one
          outputs="${RUNNER_TEMP}/g2g-live-outputs"
          log="${RUNNER_TEMP}/g2g-live.log"
          : > "${outputs}"

          # Event set for the CLI alone, as in the dry-run step
          echo "Pushing change to Gerrit..."
          GITHUB_EVENT_NAME=workflow_dispatch GITHUB_EVENT_PATH='' \
            GITHUB_OUTPUT="${outputs}" \
            python -m github2gerrit.cli "${PR_URL}" 2>&1 | tee "${log}"

          if grep -qF "(auth_user=)" "${log}"; then
            echo "::error::A Gerrit REST call ran anonymously"
            exit 1
          fi
          # Match a request line, not the client constructor's log,
          # which also names auth_user but precedes any request
          request="Gerrit REST (GET|POST|PUT|DELETE) .* "
          request+="\(auth_user=${GERRIT_HTTP_USER}\)"
          if ! grep -qE "${request}" "${log}"; then
            echo "::error::No Gerrit REST call ran authenticated"
            exit 1
          fi

          # Reconciliation can report an existing change's URL without
          # pushing, so the URL alone does not prove a push
          if ! grep -qF "Successfully pushed changes to Gerrit" "${log}"; then
            echo "::error::The CLI pushed nothing to Gerrit"
            exit 1
          fi
          change_url="$(grep -oE \
            'https://gerrit\.linuxfoundation\.org/infra/c/sandbox/\+/[0-9]+' \
            "${outputs}" | head -n 1 || true)"
          if [[ -z "${change_url}" ]]; then
            echo "::error::The CLI reported no sandbox change URL"
            exit 1
          fi

          echo "✅ Pushed to Gerrit: ${change_url}"
          {
            echo "## Live Gerrit Push ✅"
            echo "- Source PR: ${PR_URL}"
            echo "- Gerrit change: ${change_url}"
          } >> "$GITHUB_STEP_SUMMARY"
