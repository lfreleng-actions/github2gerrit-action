---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: github2gerrit
description: "Creates Gerrit changes from GitHub pull requests"

inputs:
  # Optional
  GERRIT_SSH_PRIVKEY_G2G:
    description: "SSH private key content used to authenticate to Gerrit"
    required: true
  SUBMIT_SINGLE_COMMITS:
    description: "Submit one commit at a time to the Gerrit repository"
    required: false
    default: "false"
  USE_PR_AS_COMMIT:
    description: "Use PR title and body as the commit message"
    required: false
    default: "false"
  FETCH_DEPTH:
    description: >-
      Depth of git history fetched. Applied to the tool's own fetch of
      refs/pull/<N>/head, to the push-event checkout, and as the git log
      window used to find merged commits during PR reconciliation, so
      raising it widens how far back a merged change is matched
    required: false
    default: "10"
  PR_NUMBER:
    description: "Pull request number to process, use 0 to process all open"
    required: false
    default: "0"
  GERRIT_KNOWN_HOSTS:
    description: "Known hosts entries for Gerrit SSH (single or multi-line)"
    required: false
  GERRIT_SSH_USER_G2G:
    description: "Gerrit SSH username; derived if not supplied explicitly"
    required: false
    default: ""
  GERRIT_SSH_USER_G2G_EMAIL:
    description: "Gerrit user email address; derived if not supplied explicitly"
    required: false
    default: ""
  ORGANIZATION:
    description: "GitHub organization/owner (defaults to repo owner)"
    required: false
    default: "${{ github.repository_owner }}"
  REVIEWERS_EMAIL:
    description: "Comma-separated list of reviewer emails (optional)"
    required: false
    default: ""
  ALLOW_GHE_URLS:
    description: "Allow GitHub Enterprise URLs in direct URL mode"
    required: false
    default: "false"
  PRESERVE_GITHUB_PRS:
    description: "Do not close GitHub PRs after pushing to Gerrit"
    required: false
    default: "true"
  CLOSE_MERGED_PRS:
    description: "Close GitHub PRs when corresponding Gerrit changes are merged"
    required: false
    default: "true"
  DRY_RUN:
    description: "Validate settings/PR metadata; do not write to Gerrit"
    required: false
    default: "false"
  ALLOW_DUPLICATES:
    description: "Allow submitting duplicate changes without error"
    required: false
    default: "true"
  CI_TESTING:
    description: "Enable CI testing mode; overrides .gitreview, creates orphan commits"
    required: false
    default: "false"
  G2G_NO_GERRIT:
    description: "Run full pipeline without contacting Gerrit (forces DRY_RUN, suppresses cleanup)"
    required: false
    default: "false"
  FORCE:
    description: "Force PR closure regardless of Gerrit change status (abandoned, etc)"
    required: false
    default: "false"
  ISSUE_ID:
    description: "Issue ID to include (e.g., ABC-123)"
    required: false
    default: ""
  USE_LOCAL_ACTION:
    description: >-
      Use local repository action/code instead of the PyPI package.
      Set to 'true' when testing changes in a fork or branch before merging.
    required: false
    default: "false"
  G2G_USE_SSH_AGENT:
    description: "Use SSH agent for authentication instead of file-based keys (recommended)"
    required: false
    default: "true"
  G2G_APPROVER_LOGINS:
    description: >-
      Comma-separated GitHub logins whose approving reviews clear the
      fork approval gate regardless of their author_association. Only
      needed where the people who review the code hold no standing on
      the GitHub mirror.
    required: false
    default: ""
  G2G_APPROVERS_FROM_INFO_YAML:
    description: >-
      Read approvers from the base repository's INFO.yaml, matching on
      the github_id field. The fork's copy is never consulted.
    required: false
    default: "false"
  G2G_INFO_YAML_MATCH_LFID:
    description: >-
      Also treat an INFO.yaml 'id' as a GitHub login. 'id' holds an
      LFID, so enabling this lets whoever registers that username on
      GitHub inherit committer authority. Enable only knowing the trade.
    required: false
    default: "false"
  DUPLICATE_TYPES:
    description: "Comma-separated Gerrit states for evaluating duplicates"
    required: false
    default: "open"
  NORMALISE_COMMIT:
    description: "Normalize commit messages to conventional commit format"
    required: false
    default: "false"
  VERBOSE:
    description: "Enable verbose output (sets log level to DEBUG)"
    required: false
    default: "false"
  GERRIT_SERVER:
    description: "Gerrit server hostname; derived if not supplied explicitly"
    required: false
    default: ""
  GERRIT_SERVER_PORT:
    description: "Gerrit server SSH TCP port"
    required: false
    default: "29418"
  GERRIT_PROJECT:
    description: "Gerrit project; optional if .gitreview exists"
    required: false
    default: ""
  GERRIT_HTTP_BASE_PATH:
    description: "Optional HTTP base path for Gerrit REST (e.g. /r)"
    required: false
    default: ""
  GERRIT_HTTP_USER:
    description: "Optional Gerrit HTTP user (for REST authenticated checks)"
    required: false
    default: ""
  GERRIT_HTTP_PASSWORD:
    description: "Optional Gerrit HTTP password/token (for REST authentication)"
    required: false
    default: ""
  ISSUE_ID_LOOKUP_JSON:
    description: >-
      JSON array mapping GitHub actors to Issue IDs
      (format: [{"key": "username", "value": "ISSUE-ID"}])
    required: false
    default: "[]"
  COMMIT_RULES_JSON:
    description: >-
      JSON object defining commit message rules with per-project and
      per-actor overrides. Supports arbitrary label-value pairs placed
      in the commit body or trailer block.
      (see: docs/COMMIT_RULES.md)
    required: false
    default: ""
  AUTOMATION_ONLY:
    description: "Only accept pull requests from known automation tools"
    required: false
    default: "true"
  CLEANUP_ABANDONED:
    description: "Close GitHub PRs when their Gerrit changes are abandoned"
    required: false
    default: "true"
  CLEANUP_GERRIT:
    description: "Abandon Gerrit changes when their GitHub PRs are closed"
    required: false
    default: "true"
  CREATE_MISSING:
    description: "Create a Gerrit change when an UPDATE operation cannot find an existing one"
    required: false
    default: "false"
  G2G_DISABLED:
    description: "Set to 'true' to disable the action entirely (exits successfully with a message)"
    required: false
    default: ""

outputs:
  gerrit_change_request_url:
    description: "Gerrit change URL(s) (newline-separated if multiple)"
    value: ${{ steps.capture-outputs.outputs.gerrit_change_request_url }}
  gerrit_change_request_num:
    description: "Gerrit change number(s) (newline-separated if multiple)"
    value: ${{ steps.capture-outputs.outputs.gerrit_change_request_num }}
  gerrit_commit_sha:
    description: "Patch set commit sha(s) (newline-separated if multiple)"
    value: ${{ steps.capture-outputs.outputs.gerrit_commit_sha }}

runs:
  using: "composite"
  steps:
    - name: "Check if GitHub2Gerrit is disabled"
      id: disabled-check
      shell: bash
      env:
        INPUT_G2G_DISABLED: ${{ inputs.G2G_DISABLED }}
      run: |
        # Check if GitHub2Gerrit is disabled
        set -euo pipefail
        DISABLED_ENV="${G2G_DISABLED:-}"
        DISABLED_INPUT="${INPUT_G2G_DISABLED:-}"
        # Normalize: accept the same truthy set as env_bool()
        # (1/true/yes/on, case-insensitive, trimmed)
        _normalize() {
          printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | xargs
        }
        _is_truthy() {
          case "$(_normalize "$1")" in
            1|true|yes|on) return 0 ;;
            *) return 1 ;;
          esac
        }
        if _is_truthy "${DISABLED_ENV}" || _is_truthy "${DISABLED_INPUT}"; then
          echo "🛑 GitHub2Gerrit is disabled by check of G2G_DISABLED variable or input"
          echo "disabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "disabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: "Checkout repository (push events)"
      # Push runs reconcile merged Gerrit changes back to their GitHub
      # PRs, which reads commit trailers with a local `git show` in the
      # working directory. Pull request runs need no checkout: the tool
      # fetches refs/pull/<N>/head into its own temporary directory, and
      # checking a fork head out here would both fail under
      # pull_request_target and expose a fork-controlled .gitreview.
      if: >-
        steps.disabled-check.outputs.disabled != 'true'
        && github.event_name == 'push'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}
        # The action authenticates to Gerrit over SSH and to GitHub via
        # an explicit GITHUB_TOKEN env var, so the checkout token does
        # not need to be persisted into the local git config.
        persist-credentials: false
        # Callers may place files in the workspace that this action
        # depends on. The bundled reusable workflow checks the action
        # itself out to .g2g-action and then runs it from there, so a
        # cleaning checkout would delete the action mid-run. That
        # workflow also seeds the workspace root with the target
        # repository first, because actions/checkout wipes a directory
        # that is not already a git repository whatever `clean` says.
        clean: false

    - name: "Setup Python"
      if: steps.disabled-check.outputs.disabled != 'true'
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: '${{ github.action_path }}/pyproject.toml'

    - name: "Setup uv"
      if: steps.disabled-check.outputs.disabled != 'true'
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: false

    - name: "Setup github2gerrit"
      if: steps.disabled-check.outputs.disabled != 'true'
      shell: bash
      env:
        # Provide version for hatch-vcs (via setuptools-scm)
        # when git metadata is unavailable
        # GitHub Actions shallow checkout doesn't include .git history
        SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0+dev"
        USE_LOCAL_ACTION: ${{ inputs.USE_LOCAL_ACTION }}
      run: |
        # Setup github2gerrit
        set -euo pipefail
        uv --version
        # Install locally for self-testing, use uvx for external repos
        if [[ "${USE_LOCAL_ACTION}" == "true" ]] || \
           [[ "${GITHUB_REPOSITORY}" =~ lfreleng-actions/github2gerrit-action ]]; then
          echo "Installing with: uv pip install --system ${GITHUB_ACTION_PATH}"
          uv pip install --system "${GITHUB_ACTION_PATH}"
        else
          echo "uvx will install GitHub2Gerrit from PyPI"
        fi

    - name: "Validate PR_NUMBER usage"
      # yamllint disable-line rule:line-length
      if: ${{ steps.disabled-check.outputs.disabled != 'true' && github.event_name != 'workflow_dispatch' && inputs.PR_NUMBER != '' && inputs.PR_NUMBER != '0' }}
      shell: bash
      run: |
        # Validate PR_NUMBER usage
        set -euo pipefail
        echo "Error: PR_NUMBER only valid during workflow_dispatch events."
        exit 2

    - name: "Normalize PR_NUMBER"
      if: ${{ steps.disabled-check.outputs.disabled != 'true' && github.event_name == 'workflow_dispatch' }}
      id: normalize
      shell: bash
      env:
        INPUT_PR_NUMBER: ${{ inputs.PR_NUMBER }}
      run: |
        # Normalize PR_NUMBER
        set -euo pipefail
        pr_in="${INPUT_PR_NUMBER:-}"
        if [[ -z "${pr_in}" || "${pr_in}" == "null" ]]; then
          pr_in="0"
        fi
        if ! [[ "${pr_in}" =~ ^(0|[1-9][0-9]*)$ ]]; then
          echo "Error: PR_NUMBER must be a canonical numeric value (no leading zeros)"
          exit 2
        fi
        if [[ "${pr_in}" == "0" ]]; then
          echo "sync_all=true" >> "$GITHUB_OUTPUT"
        else
          echo "pr_number=${pr_in}" >> "$GITHUB_OUTPUT"
        fi

    - name: "Extract PR number, validate context"
      if: steps.disabled-check.outputs.disabled != 'true'
      id: extract
      shell: bash
      env:
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
        DISPATCH_PR_NUMBER: ${{ steps.normalize.outputs.pr_number }}
        DISPATCH_SYNC_ALL: ${{ steps.normalize.outputs.sync_all }}
      run: |
        # Extract PR number, validate context
        set -euo pipefail

        # Push events don't need PR_NUMBER (used for closing merged PRs)
        # The CLI handles push events specially via _process_close_merged_prs()
        if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
          echo "Push event detected - will process merged commits for PR closure"
          # Emit an empty PR number to signal intentional push handling
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Honor PR_NUMBER or sync-all from workflow_dispatch normalization
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          if [[ -n "${DISPATCH_SYNC_ALL:-}" ]]; then
            echo "Processing all open pull requests via workflow_dispatch."
            echo "sync_all=true" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "${DISPATCH_PR_NUMBER:-}" || "${DISPATCH_PR_NUMBER}" == "null" ]]; then
              echo "Error: provide PR_NUMBER or set 0 to process all PRs."
              exit 2
            fi
            echo "pr_number=${DISPATCH_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
        else
          pr_number="${EVENT_PR_NUMBER}"
          if [[ -z "${pr_number}" || "${pr_number}" == "null" ]]; then
            echo "Error: PR_NUMBER is empty."
            echo "This action requires a valid pull request context."
            echo "Current event: ${GITHUB_EVENT_NAME}"
            exit 2
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
        fi

    - name: "Run github2gerrit Python CLI"
      if: steps.disabled-check.outputs.disabled != 'true'
      id: run-cli
      shell: bash
      env:
        # GitHub token for API access
        GITHUB_TOKEN: ${{ github.token }}

        # Primary inputs
        SUBMIT_SINGLE_COMMITS: ${{ inputs.SUBMIT_SINGLE_COMMITS }}
        USE_PR_AS_COMMIT: ${{ inputs.USE_PR_AS_COMMIT }}
        FETCH_DEPTH: ${{ inputs.FETCH_DEPTH }}
        GERRIT_KNOWN_HOSTS: ${{ inputs.GERRIT_KNOWN_HOSTS }}
        GERRIT_SSH_PRIVKEY_G2G: ${{ inputs.GERRIT_SSH_PRIVKEY_G2G }}
        GERRIT_SSH_USER_G2G: ${{ inputs.GERRIT_SSH_USER_G2G }}
        GERRIT_SSH_USER_G2G_EMAIL: ${{ inputs.GERRIT_SSH_USER_G2G_EMAIL }}
        ORGANIZATION: ${{ inputs.ORGANIZATION }}
        REVIEWERS_EMAIL: ${{ inputs.REVIEWERS_EMAIL }}
        ALLOW_GHE_URLS: ${{ inputs.ALLOW_GHE_URLS }}
        PRESERVE_GITHUB_PRS: ${{ inputs.PRESERVE_GITHUB_PRS }}
        DRY_RUN: ${{ inputs.DRY_RUN }}
        ALLOW_DUPLICATES: ${{ inputs.ALLOW_DUPLICATES }}
        ISSUE_ID: ${{ inputs.ISSUE_ID }}
        ISSUE_ID_LOOKUP_JSON: ${{ inputs.ISSUE_ID_LOOKUP_JSON }}
        COMMIT_RULES_JSON: ${{ inputs.COMMIT_RULES_JSON }}
        CI_TESTING: ${{ inputs.CI_TESTING }}
        CLOSE_MERGED_PRS: ${{ inputs.CLOSE_MERGED_PRS }}
        FORCE: ${{ inputs.FORCE }}
        DUPLICATE_TYPES: ${{ inputs.DUPLICATE_TYPES }}
        NORMALISE_COMMIT: ${{ inputs.NORMALISE_COMMIT }}
        G2G_USE_SSH_AGENT: ${{ inputs.G2G_USE_SSH_AGENT }}
        G2G_APPROVER_LOGINS: ${{ inputs.G2G_APPROVER_LOGINS }}
        # yamllint disable-line rule:line-length
        G2G_APPROVERS_FROM_INFO_YAML: ${{ inputs.G2G_APPROVERS_FROM_INFO_YAML }}
        G2G_INFO_YAML_MATCH_LFID: ${{ inputs.G2G_INFO_YAML_MATCH_LFID }}
        G2G_VERBOSE: ${{ inputs.VERBOSE }}
        AUTOMATION_ONLY: ${{ inputs.AUTOMATION_ONLY }}
        CLEANUP_ABANDONED: ${{ inputs.CLEANUP_ABANDONED }}
        CLEANUP_GERRIT: ${{ inputs.CLEANUP_GERRIT }}
        CREATE_MISSING: ${{ inputs.CREATE_MISSING }}

        # Optional Gerrit overrides (when .gitreview is missing)
        GERRIT_SERVER: ${{ inputs.GERRIT_SERVER }}
        GERRIT_SERVER_PORT: ${{ inputs.GERRIT_SERVER_PORT }}
        GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}

        # Optional REST path/creds (non-fatal in dry-run)
        GERRIT_HTTP_BASE_PATH: ${{ inputs.GERRIT_HTTP_BASE_PATH }}
        GERRIT_HTTP_USER: ${{ inputs.GERRIT_HTTP_USER }}
        GERRIT_HTTP_PASSWORD: ${{ inputs.GERRIT_HTTP_PASSWORD }}

        # Pass-through GitHub context used by the CLI
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        # Full owner/repo of the PR head. Differs from GITHUB_REPOSITORY
        # for fork pull requests, whose tree must not influence Gerrit
        # target resolution.
        # yamllint disable-line rule:line-length
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        GITHUB_ACTOR: ${{ github.actor }}
        SYNC_ALL_OPEN_PRS: ${{ steps.extract.outputs.sync_all }}
        PR_NUMBER: ${{ steps.extract.outputs.pr_number }}
        G2G_TEST_MODE: "false"
        G2G_NO_GERRIT: ${{ inputs.G2G_NO_GERRIT }}
        USE_LOCAL_ACTION: ${{ inputs.USE_LOCAL_ACTION }}
      run: |
        # Run github2gerrit Python CLI
        set -euo pipefail
        # Use different invocation methods based on repository or USE_LOCAL_ACTION flag
        if [[ "${USE_LOCAL_ACTION}" == "true" ]] || \
           [[ "${GITHUB_REPOSITORY}" =~ lfreleng-actions/github2gerrit-action ]]; then
          echo "Running:python -m github2gerrit.cli"
          python -m github2gerrit.cli
        else
          echo "Running: uvx --from github2gerrit github2gerrit"
          uvx --from github2gerrit github2gerrit
        fi

    - name: "Capture outputs"
      if: steps.disabled-check.outputs.disabled != 'true'
      id: capture-outputs
      shell: bash
      # yamllint disable rule:line-length
      run: |
        # Capture outputs
        set -euo pipefail
        # Use GitHub Actions multiline output format
        {
          echo "gerrit_change_request_url<<G2G"
          printf '%s\n' "${GERRIT_CHANGE_REQUEST_URL:-}"
          echo "G2G"
          echo "gerrit_change_request_num<<G2G"
          printf '%s\n' "${GERRIT_CHANGE_REQUEST_NUM:-}"
          echo "G2G"
          echo "gerrit_commit_sha<<G2G"
          printf '%s\n' "${GERRIT_COMMIT_SHA:-}"
          echo "G2G"
        } >> "$GITHUB_OUTPUT"
