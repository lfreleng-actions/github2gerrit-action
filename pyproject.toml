[project]
name = "github2gerrit"
dynamic = ["version"]
description = "Submit a GitHub pull request to a Gerrit repository."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Matthew Watkins", email = "mwatkins@linuxfoundation.org" }
]
keywords = ["github", "gerrit", "ci", "actions", "typer", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control",
  "Typing :: Typed",
]
dependencies = [
  # CLI framework (Typer)
  #
  # typer vendors its own copy of click from 0.26 onward (typer._click)
  # and depends on the installed click below that, so both regimes fall
  # inside this floor. Nothing here imports click directly, so click is
  # deliberately not a dependency: taking a symbol from click that typer
  # also exposes gives two distinct objects under the vendored regime,
  # which fails silently. See the dev extra for the one place the
  # installed click still matters.
  "typer>=0.20.1",

  # Rich formatting for CLI output
  "rich>=14.2.0",

  # GitHub API client
  "PyGithub>=2.8.1",

  # Gerrit REST client, and the HTTP library it and GerritRestClient
  # share
  "python-gerrit-api>=3.1.0",
  "requests>=2.33.0",

  # git-review CLI used for pushing to Gerrit
  "git-review>=2.5.0",

  # YAML parsing for commit normalization
  "PyYAML>=6.0.3",

  # Security: Fix CVE-2025-69277 (libsodium vulnerability)
  "PyNaCl>=1.6.2",

  # Security: Fix CVE-2026-21441 (decompression-bomb vulnerability)
  "urllib3>=2.6.3",

  # Security: cryptography bundles OpenSSL in its wheels, so OpenSSL
  # security fixes ship as new cryptography releases. Floor at the
  # patched release: fixes CVE-2026-26007 (SECT curve subgroup attack,
  # 46.0.5) and GHSA-537c-gmf6-5ccf (vulnerable OpenSSL in wheels, no
  # CVE assigned, 48.0.1). No upper bound, so future security releases
  # are not held back.
  "cryptography>=48.0.1",
]

[project.urls]
Homepage = "https://github.com/lfreleng-actions/github2gerrit-action"
Repository = "https://github.com/lfreleng-actions/github2gerrit-action"
Issues = "https://github.com/lfreleng-actions/github2gerrit-action/issues"

[project.scripts]
github2gerrit = "github2gerrit.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+dev"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/github2gerrit"]

[tool.hatch.build.targets.sdist]
exclude = [
  "CLAUDE.md",
  "/.git",
  "/.github",
  "/scripts",
  "/debug",
  "*.egg-info",
]

[project.optional-dependencies]
dev = [
  # Test
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "coverage[toml]>=7.10.6",
  "responses>=0.25.8",

  # typer.testing.CliRunner subclasses click.testing.CliRunner up to
  # typer 0.25, so under that half of the supported range result.stderr
  # comes from the installed click, which only captures it separately
  # from 8.2 onward and raises ValueError before that. typer 0.26 and
  # later vendor their own copy and are unaffected. Test-only: no
  # runtime code imports click.
  "click>=8.2",

  # Lint/format
  "ruff>=0.6.3",
  "mypy>=1.17.1",

  # Type checking helpers
  "pytest-mock>=3.15.1",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.31.0",
  "types-urllib3>=1.26.25.14",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# Keep default rules strict; allow incremental adoption via ignores if needed.
select = [
  "E", "F", "I", "UP", "ASYNC", "S", "B", "A",
  "C4", "DTZ", "EXE", "G", "PIE", "PLE", "PLW",
  "RUF", "SIM", "T20", "TID", "TRY"
]
ignore = [
  # Allow module-level prints for CLI feedback (T201)
  "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "PLW0603", "TRY003", "S603", "S607", "E501"]
"scripts/*.py" = ["S603", "S607"]
"sitecustomize.py" = ["S110", "SIM103", "SIM105", "PLW2901"]
"src/github2gerrit/duplicate_detection.py" = ["S310"]
"src/github2gerrit/gerrit_rest.py" = ["S310", "TRY301"]
# S310 audits urlopen for non-HTTP schemes such as file:. This module
# builds the URL from a literal https://raw.githubusercontent.com/ prefix
# and passes it through _validate_raw_url, which requires scheme https and
# host raw.githubusercontent.com before the fetch runs.
"src/github2gerrit/gitreview.py" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["github2gerrit"]
lines-after-imports = 2
force-single-line = true

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
# Annotation rules are relaxed here and switched back on for the shipped
# package by the github2gerrit.* override below. The obvious shape --
# global strictness plus a tests.* relaxation -- cannot work, because
# neither half of it matches:
#
#   * tests/ has no __init__.py, so mypy names its modules test_cli,
#     conftest and so on, never tests.test_cli.
#   * A pattern cannot recover the real names either. mypy accepts "*"
#     only as a whole dotted component, so "test_*" is rejected outright
#     ("Patterns must be fully-qualified module names, optionally with
#     '*' in some components") and the section is discarded in silence.
#
# Inverting the default is the only form that both applies and keeps
# applying when test files are added. It also suits scripts/, which is
# unannotated by design.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
no_implicit_optional = true
show_error_codes = true
pretty = true
# exclude skips directory discovery only; files named explicitly on the
# command line are still checked. The pre-commit hook passes the src,
# scripts and tests directories and sitecustomize.py, so these patterns
# filter discovery beneath those directories -- keep this to paths that
# hold no first-party Python.
exclude = ["build/", "dist/", "docs/"]

# The shipped package is held to full strict-mode annotation rules.
# Everything else -- tests/, scripts/, sitecustomize.py -- keeps every
# correctness check (check_untyped_defs, warn_unreachable,
# strict_equality, no_implicit_reexport) but is not required to annotate
# signatures. This mirrors the basedpyright stance recorded in
# [[tool.pyright.executionEnvironments]] below, where #392 disabled
# reportMissingParameterType for tests/ because pytest already resolves
# fixtures by parameter name.
[[tool.mypy.overrides]]
module = ["github2gerrit.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

# python-gerrit-api ships no type information (no py.typed marker).
[[tool.mypy.overrides]]
module = ["gerrit"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["click", "click.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["typer", "typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["github2gerrit.rich_display"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.coverage.run]
branch = true
# Keep transient coverage data out of the working tree so tests that
# inspect on-disk repository content never see .coverage* files.
# During pytest runs tests/conftest.py sets COVERAGE_FILE (env), which
# takes precedence; this value covers direct coverage invocations and
# satisfies python-test-action's data_file configuration check.
data_file = "${TMPDIR-/tmp}/.coverage.github2gerrit"
source = ["github2gerrit"]
omit = [
  "tests/*",
  "src/github2gerrit/gerrit_rest.py",
  "src/github2gerrit/similarity.py",
  "src/github2gerrit/duplicate_detection.py",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
precision = 1

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=github2gerrit --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.pyright]
pythonVersion = "3.11"
# Every Python path in the repository, so an editor's language server and
# the pre-commit hook agree on the checked set. Keep in sync with the
# basedpyright hook's `files` pattern in .pre-commit-config.yaml.
include = ["src", "tests", "scripts", "sitecustomize.py"]
typeCheckingMode = "strict"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
# Focus on real issues, ignore pedantic ones
reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportUnusedVariable = "none"
reportUnusedImport = "none"
reportConstantRedefinition = "none"
reportUnusedClass = "none"
reportUntypedClassDecorator = "none"
# Enable additional type checking features
reportCallIssue = "error"
reportArgumentType = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportUnsupportedDunderAll = "error"

# Test code is held to the same correctness rules as src/, but not to the
# same annotation rules. This mirrors the mypy stance above, where tests
# set disallow_untyped_defs = false.
[[tool.pyright.executionEnvironments]]
root = "tests"
# pytest resolves fixtures by parameter name at collection time, so
# annotating every `monkeypatch`, `tmp_path` and `mock_*` parameter adds
# no checking that the collection step does not already perform.
reportMissingParameterType = "none"
# @pytest.fixture and @pytest.mark.* read as untyped whenever pytest is
# not importable. The pre-commit hook runs basedpyright without a project
# virtualenv, so this fires there but not locally. The same tolerance is
# already applied repository-wide via reportMissingImports = "none".
reportUntypedFunctionDecorator = "none"


[tool.uv]
# uv will manage installation based on this pyproject and lockfile.
# No extra settings are required here; this stanza reserves the
# namespace for future use if needed.
managed = true

[dependency-groups]
# The build backend, on its own so that action.yaml can install it
# hash-verified from the lockfile alongside the runtime dependencies and
# build the package without isolation, fetching nothing the lock does not
# name.
build = [
    "hatch-vcs>=0.5.0",
    "hatchling>=1.28.0",
]
dev = [
    { include-group = "build" },
    # Pull in the dev extra defined above. uv installs the `dev` group by
    # default, so a bare `uv sync` provisions pytest and friends; without
    # this, `uv run pytest` silently falls through to whatever pytest sits
    # on PATH. Declared by reference rather than duplicated because CI
    # installs the extra directly (`uv pip install ./[test,dev]`) and
    # cannot see dependency groups.
    "github2gerrit[dev]",
]
# Nothing installs this group through uv. It exists so that uv.lock
# carries an exact uv release with its wheel hashes: action.yaml reads
# that entry and installs it with pip under --require-hashes to put uv on
# the runner, and Dependabot's uv ecosystem bumps the lock entry like any
# other dependency. A static version in action.yaml would have no such
# upkeep, and no hashes.
toolchain = [
    "uv>=0.13.5",
]
