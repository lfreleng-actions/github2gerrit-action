---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "GitHub2Gerrit [R]"

# Reusable workflow wrapping the github2gerrit composite action.
#
# The composite action is not pinned to a separate version: this
# workflow checks out the action from its own repository at the exact
# commit the caller pinned this workflow to (job.workflow_sha) and
# runs it as a local action. Workflow and action therefore always
# ship as one unit with matching input interfaces, and the Python tool
# itself installs as the latest release from PyPI at runtime (uvx).
#
# Supported caller trigger events:
#
#   - pull_request_target (opened/reopened/edited/synchronize/closed):
#     mirrors the pull request to Gerrit
#   - push: closes GitHub PRs whose Gerrit changes have merged
#     (CLOSE_MERGED_PRS flow)
#   - workflow_dispatch: manual runs (PR_NUMBER selects a single PR;
#     0 processes all open PRs) and Gerrit-event dispatches
#     (GERRIT_CHANGE_URL/GERRIT_EVENT_TYPE close the source PR of a
#     merged or abandoned Gerrit change)
#
# Callers with a workflow_dispatch trigger should forward their
# dispatch inputs, for example:
#
#   with:
#     PR_NUMBER: ${{ inputs.PR_NUMBER || '0' }}
#     GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL || '' }}
#     GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE || '' }}
#
# Input defaults match the composite action defaults, so omitting an
# input never changes behavior relative to calling the action directly.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # Core behavior
      SUBMIT_SINGLE_COMMITS:
        description: "Submit one commit at a time to the Gerrit repository"
        required: false
        default: false
        type: boolean
      USE_PR_AS_COMMIT:
        description: "Use PR body and title as commit message"
        required: false
        default: false
        type: boolean
      FETCH_DEPTH:
        description: >-
          Git history depth. Also the git log window for merged-PR
          reconciliation, so lowering it narrows how far back a merged
          change is matched. (Default: 10)
        required: false
        default: "10"
        type: string
      PR_NUMBER:
        description: "PR number to process on dispatch; 0 processes all open"
        required: false
        default: "0"
        type: string
      PRESERVE_GITHUB_PRS:
        description: "Do not close GitHub PRs after pushing to Gerrit"
        required: false
        default: true
        type: boolean
      CLOSE_MERGED_PRS:
        description: "Close GitHub PRs when their Gerrit change merges"
        required: false
        default: true
        type: boolean
      CLEANUP_ABANDONED:
        description: "Close GitHub PRs for abandoned Gerrit changes"
        required: false
        default: true
        type: boolean
      CLEANUP_GERRIT:
        description: "Abandon Gerrit changes when their GitHub PR closes"
        required: false
        default: true
        type: boolean
      CREATE_MISSING:
        description: "Create a new change when UPDATE finds no existing change"
        required: false
        default: false
        type: boolean
      AUTOMATION_ONLY:
        description: "Accept PRs from known automation tools only"
        required: false
        default: true
        type: boolean
      NORMALISE_COMMIT:
        description: "Normalize commit messages to conventional commit format"
        required: false
        default: false
        type: boolean
      COMMIT_RULES_JSON:
        description: "JSON commit message validation rules"
        required: false
        default: ""
        type: string
      ALLOW_DUPLICATES:
        description: "Allow submitting duplicate changes without error"
        required: false
        default: true
        type: boolean
      DUPLICATE_TYPES:
        description: "Comma-separated Gerrit states for evaluating duplicates"
        required: false
        default: "open"
        type: string
      FORCE:
        description: "Force PR closure regardless of Gerrit change status"
        required: false
        default: false
        type: boolean
      DRY_RUN:
        description: "Validate settings and PR metadata; do not write to Gerrit"
        required: false
        default: false
        type: boolean
      VERBOSE:
        description: "Enable verbose output (sets log level to DEBUG)"
        required: false
        default: false
        type: boolean
      G2G_NO_GERRIT:
        description: >-
          Test mode: skip all Gerrit server interactions. When true,
          takes precedence over the G2G_NO_GERRIT repository variable
          (used by CI to exercise the workflow_call path without
          Gerrit access); when false or omitted, the repository
          variable applies
        required: false
        default: false
        type: boolean
      ALLOW_GHE_URLS:
        description: "Allow GitHub Enterprise URLs in direct URL mode"
        required: false
        default: false
        type: boolean

      # Gerrit connection
      GERRIT_KNOWN_HOSTS:
        description: "known hosts"
        required: false
        default: ""
        type: string
      GERRIT_SERVER:
        description: "Gerrit hostname ex: git.opendaylight.org"
        required: false
        default: ""
        type: string
      GERRIT_SERVER_PORT:
        description: "Gerrit port. (Default: 29418)"
        required: false
        default: "29418"
        type: string
      GERRIT_PROJECT:
        description: "Gerrit project name. ex: releng/builder"
        required: false
        default: ""
        type: string
      GERRIT_SSH_USER_G2G:
        description: "Gerrit user-id for SSH"
        required: false
        default: ""
        type: string
      GERRIT_SSH_USER_G2G_EMAIL:
        description: "Email of the SSH user"
        required: false
        default: ""
        type: string
      GERRIT_HTTP_BASE_PATH:
        description: "Optional HTTP base path for Gerrit REST (e.g. /r)"
        required: false
        default: ""
        type: string
      GERRIT_HTTP_USER:
        description: "Optional Gerrit HTTP user for REST checks"
        required: false
        default: ""
        type: string
      GERRIT_HTTP_PASSWORD:
        description: "Optional Gerrit HTTP password/token for REST checks"
        required: false
        default: ""
        type: string
      G2G_USE_SSH_AGENT:
        description: "Use SSH agent for auth instead of file-based keys"
        required: false
        default: true
        type: boolean

      # Fork approval gate: additional approver sources. Both default
      # off; each widens who counts as a maintainer.
      G2G_APPROVER_LOGINS:
        description: "Comma-separated logins whose approvals clear the gate"
        required: false
        default: ""
        type: string
      G2G_APPROVERS_FROM_INFO_YAML:
        description: "Read approvers from the base repo's INFO.yaml"
        required: false
        default: false
        type: boolean
      G2G_INFO_YAML_MATCH_LFID:
        description: "Also treat an INFO.yaml 'id' as a GitHub login"
        required: false
        default: false
        type: boolean

      # Metadata
      ORGANIZATION:
        description: >-
          Organization name, e.g. opendaylight
          (defaults to the repository owner)
        required: false
        type: string
        default: ""
      REVIEWERS_EMAIL:
        description: "Committer emails (comma separated) to notify reviewers"
        required: false
        default: ""
        type: string
      ISSUE_ID:
        description: "Issue ID to include (e.g., ABC-123)"
        required: false
        default: ""
        type: string
      ISSUE_ID_LOOKUP_JSON:
        description: "JSON array mapping GitHub actors to Issue IDs"
        required: false
        default: "[]"
        type: string

      # Gerrit event dispatch context (Gerrit -> GitHub reverse flow).
      # Set these when Gerrit-side automation dispatches the caller
      # workflow to report a merged/abandoned change; the tool closes
      # the source GitHub PR and runs cleanup instead of processing
      # pull requests.
      GERRIT_CHANGE_URL:
        description: "Gerrit change URL from a Gerrit event dispatch"
        required: false
        default: ""
        type: string
      GERRIT_EVENT_TYPE:
        description: "Gerrit event type (e.g. change-merged)"
        required: false
        default: ""
        type: string
      GERRIT_BRANCH:
        description: "Target branch override from a Gerrit event dispatch"
        required: false
        default: ""
        type: string
    secrets:
      GERRIT_SSH_PRIVKEY_G2G:
        description: "SSH Private key"
        required: true
    outputs:
      gerrit_change_request_url:
        description: "Gerrit change URL(s), newline-separated"
        value: ${{ jobs.github2gerrit.outputs.gerrit_change_request_url }}
      gerrit_change_request_num:
        description: "Gerrit change number(s), newline-separated"
        value: ${{ jobs.github2gerrit.outputs.gerrit_change_request_num }}
      gerrit_commit_sha:
        description: "Patch set commit SHA(s), newline-separated"
        value: ${{ jobs.github2gerrit.outputs.gerrit_commit_sha }}

# Default to no permissions; the job grants only what it needs.
permissions: {}

jobs:
  github2gerrit:
    name: "GitHub2Gerrit"
    # Run for pull request context (mirror the PR to Gerrit), push
    # events (close PRs for merged Gerrit changes), and dispatch
    # events from the caller (manual PR processing or Gerrit-event
    # dispatches)
    #
    # Three event families reach this job carrying pull_request.number
    # while being unable to transfer anything: reviews, review
    # comments, and pull_request on a fork head, which GitHub denies
    # secrets. All three are excluded rather than left to stop inside
    # the tool, because reaching the tool means first taking a slot in
    # the per-PR concurrency group below, where GitHub keeps one
    # running and one pending run and cancels the older pending one.
    # A run that can do no useful work must not be able to evict a
    # re-check that can.
    #
    # pull_request on a fork head is excluded for the same reason,
    # since GitHub denies it secrets — except in the keyless modes.
    # G2G_NO_GERRIT and DRY_RUN both run the pipeline without ever
    # reaching Gerrit, _skip_unprivileged_fork_run exempts them, and
    # this repository's own testing workflow calls this one with
    # G2G_NO_GERRIT on every trigger. Excluding them unconditionally
    # would skip that coverage on any fork pull request. They cannot
    # transfer, so the slot they take is the accepted cost of testing
    # the path consumers actually use.
    #
    # G2G_NO_GERRIT is read from the repository variable too, matching
    # the fallback the action step below applies, so a project setting
    # only the variable is not skipped here. Compared against 'true'
    # rather than tested for truthiness, because an unset variable is
    # the empty string while one set to 'false' is a non-empty string
    # and would otherwise count as enabled.
    #
    # pull_request_target on a fork head is deliberately kept: it runs
    # from the default branch, holds the credentials, and is the
    # trigger that applies the approval gate.
    #
    # issue_comment fires for issues, for open pull requests and for
    # closed ones. The issue payload must carry a pull_request member
    # and still be open: admitting a bare issue.number would treat a
    # comment on issue N as pull request N, and a closed pull request
    # has no gate left to lift, so a run there could only fail.
    #
    # The directive is matched here for the same concurrency reason:
    # ordinary conversation and bare mentions stay out of the group
    # entirely. The mention and the command phrase are tested
    # separately rather than as one string, because the parser accepts
    # any whitespace between them and GitHub's own mention
    # autocomplete inserts a trailing space — so '@github2gerrit  check'
    # is both a supported directive and a likely one. Requiring a
    # single literal space would skip it silently, which is worse than
    # admitting an extra run: a maintainer would comment and see
    # nothing happen, with no feedback anywhere.
    #
    # Deliberately looser than the CLI's grammar in the other
    # direction: a comment mentioning the tool and containing the word
    # 'check' anywhere is admitted here and judged there. Erring that
    # way costs a slot; erring the other way loses a directive. Drift
    # is guarded by tests/test_action_step_validation.py, which
    # requires every phrase of every open command to appear below.
    # yamllint disable-line rule:line-length
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.number && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment' && (github.event_name != 'pull_request' || inputs.G2G_NO_GERRIT || inputs.DRY_RUN || vars.G2G_NO_GERRIT == 'true' || github.event.pull_request.head.repo.full_name == github.repository)) || (github.event.issue.number && github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.comment.body, '@github2gerrit') && (contains(github.event.comment.body, 'check') || contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'retry'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read  # Read repository contents (checkout, etc.)
      pull-requests: write  # Comment on and update the mirrored PR
      issues: write  # Post status/back-reference comments on issues
    # Serialize runs per pull request; non-PR runs (push events and
    # dispatches) queue per event type. Queue rather than cancel so an
    # in-flight push to Gerrit is never interrupted.
    #
    # Three operands, because a pull request reaches this job through
    # three payload shapes. Comment payloads carry github.event.issue
    # rather than github.event.pull_request, and a single-PR
    # workflow_dispatch carries neither: it names its target in
    # inputs.PR_NUMBER. Any pull request able to arrive by more than
    # one route must share one group, or two runs could transfer the
    # same commit concurrently and leave two Gerrit changes.
    #
    # The dispatch operand is the raw string, so a non-canonical value
    # such as '029' would key on '029' while naming pull request 29.
    # GitHub expressions have no arithmetic to normalise it, so the
    # action rejects such values outright instead: see the PR_NUMBER
    # normalisation step, whose pattern admits only canonical numbers.
    # A run that cannot start cannot race.
    #
    # '0' is a bulk sweep and '' is unset, neither of which names a
    # pull request, so both fall through to the event name rather than
    # collapsing every run into one group.
    concurrency:
      # yamllint disable-line rule:line-length
      group: g2g-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || ((inputs.PR_NUMBER != '' && inputs.PR_NUMBER != '0') && inputs.PR_NUMBER) || github.event_name }}
      cancel-in-progress: false
    outputs:
      # yamllint disable rule:line-length
      gerrit_change_request_url: ${{ steps.g2g.outputs.gerrit_change_request_url }}
      gerrit_change_request_num: ${{ steps.g2g.outputs.gerrit_change_request_num }}
      gerrit_commit_sha: ${{ steps.g2g.outputs.gerrit_commit_sha }}
      # yamllint enable rule:line-length
    steps:
      # Seed the workspace root with the target repository on pushes,
      # before the action is placed at .g2g-action below.
      #
      # Ordering is load-bearing. actions/checkout deletes the entire
      # contents of its target directory when that directory is not
      # already a git repository, and it does so regardless of `clean`.
      # Checking the target out first makes the root a repository, so
      # the composite action's own push checkout later finds a valid
      # repo and leaves .g2g-action alone.
      #
      # Pull request runs need no checkout at all: the tool fetches
      # refs/pull/<N>/head into its own temporary directory.
      - name: Checkout target repository (push events)
        if: ${{ github.event_name == 'push' }}
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.FETCH_DEPTH }}
          persist-credentials: false

      # Resolve the repository that provides this reusable workflow so
      # the bundled action ships from the exact same commit; the
      # workflow and action interfaces then never drift apart.
      # job.workflow_repository/job.workflow_sha identify the reusable
      # workflow on github.com; the legacy github.job_workflow_ref and
      # github.job_workflow_sha properties act as a fallback for GitHub
      # Enterprise Server, where the job context properties are not
      # available
      - name: Resolve workflow source repository
        id: workflow-source
        shell: bash
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          LEGACY_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          # Resolve the workflow source repository and commit
          source="job context"
          repository="$JOB_WORKFLOW_REPOSITORY"
          workflow_sha="$JOB_WORKFLOW_SHA"
          if [[ -z "$repository" ]]; then
            # Fall back to extracting owner/repo from a ref such as:
            # owner/repo/.github/workflows/github2gerrit.yaml@refs/tags/v1.4.2
            source="legacy github context"
            repository="${JOB_WORKFLOW_REF%%/.github/*}"
            workflow_sha="$LEGACY_WORKFLOW_SHA"
          fi
          if [[ ! "$repository" =~ ^[^/@]+/[^/@]+$ ]]; then
            echo "Error: cannot derive owner/repo (source: ${source};" \
              "job.workflow_repository: '${JOB_WORKFLOW_REPOSITORY}';" \
              "github.job_workflow_ref: '${JOB_WORKFLOW_REF}')" >&2
            exit 1
          fi
          if [[ -z "$workflow_sha" ]]; then
            echo "Error: cannot derive workflow commit SHA (source:" \
              "${source}; job.workflow_sha: '${JOB_WORKFLOW_SHA}';" \
              "github.job_workflow_sha: '${LEGACY_WORKFLOW_SHA}')" >&2
            exit 1
          fi
          echo "Workflow source: ${repository}@${workflow_sha} (${source})"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$workflow_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout github2gerrit action at workflow SHA
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ steps.workflow-source.outputs.sha }}
          path: .g2g-action
          persist-credentials: false

      - name: Run github2gerrit composite action
        id: g2g
        uses: ./.g2g-action
        env:
          # Gerrit event dispatch context: when GERRIT_CHANGE_URL and
          # GERRIT_EVENT_TYPE carry values, the tool closes the source
          # GitHub PR of the change and returns before any pull
          # request processing (bulk mode included); empty values are
          # a no-op
          GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
          GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
          GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
        with:
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          SUBMIT_SINGLE_COMMITS: ${{ inputs.SUBMIT_SINGLE_COMMITS }}
          USE_PR_AS_COMMIT: ${{ inputs.USE_PR_AS_COMMIT }}
          FETCH_DEPTH: ${{ inputs.FETCH_DEPTH }}
          PRESERVE_GITHUB_PRS: ${{ inputs.PRESERVE_GITHUB_PRS }}
          CLOSE_MERGED_PRS: ${{ inputs.CLOSE_MERGED_PRS }}
          CLEANUP_ABANDONED: ${{ inputs.CLEANUP_ABANDONED }}
          CLEANUP_GERRIT: ${{ inputs.CLEANUP_GERRIT }}
          CREATE_MISSING: ${{ inputs.CREATE_MISSING }}
          AUTOMATION_ONLY: ${{ inputs.AUTOMATION_ONLY }}
          NORMALISE_COMMIT: ${{ inputs.NORMALISE_COMMIT }}
          COMMIT_RULES_JSON: ${{ inputs.COMMIT_RULES_JSON }}
          ALLOW_DUPLICATES: ${{ inputs.ALLOW_DUPLICATES }}
          DUPLICATE_TYPES: ${{ inputs.DUPLICATE_TYPES }}
          FORCE: ${{ inputs.FORCE }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
          VERBOSE: ${{ inputs.VERBOSE }}
          ALLOW_GHE_URLS: ${{ inputs.ALLOW_GHE_URLS }}
          GERRIT_KNOWN_HOSTS: ${{ inputs.GERRIT_KNOWN_HOSTS }}
          GERRIT_SSH_PRIVKEY_G2G: ${{ secrets.GERRIT_SSH_PRIVKEY_G2G }}
          GERRIT_SERVER: ${{ inputs.GERRIT_SERVER }}
          GERRIT_SERVER_PORT: ${{ inputs.GERRIT_SERVER_PORT }}
          GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
          GERRIT_SSH_USER_G2G: ${{ inputs.GERRIT_SSH_USER_G2G }}
          GERRIT_SSH_USER_G2G_EMAIL: ${{ inputs.GERRIT_SSH_USER_G2G_EMAIL }}
          GERRIT_HTTP_BASE_PATH: ${{ inputs.GERRIT_HTTP_BASE_PATH }}
          GERRIT_HTTP_USER: ${{ inputs.GERRIT_HTTP_USER }}
          GERRIT_HTTP_PASSWORD: ${{ inputs.GERRIT_HTTP_PASSWORD }}
          G2G_USE_SSH_AGENT: ${{ inputs.G2G_USE_SSH_AGENT }}
          G2G_APPROVER_LOGINS: ${{ inputs.G2G_APPROVER_LOGINS }}
          # yamllint disable-line rule:line-length
          G2G_APPROVERS_FROM_INFO_YAML: ${{ inputs.G2G_APPROVERS_FROM_INFO_YAML }}
          G2G_INFO_YAML_MATCH_LFID: ${{ inputs.G2G_INFO_YAML_MATCH_LFID }}
          ORGANIZATION: ${{ inputs.ORGANIZATION || github.repository_owner }}
          REVIEWERS_EMAIL: ${{ inputs.REVIEWERS_EMAIL }}
          ISSUE_ID: ${{ inputs.ISSUE_ID }}
          ISSUE_ID_LOOKUP_JSON: ${{ inputs.ISSUE_ID_LOOKUP_JSON }}
          G2G_NO_GERRIT: ${{ inputs.G2G_NO_GERRIT || vars.G2G_NO_GERRIT }}
          G2G_DISABLED: ${{ vars.G2G_DISABLED }}
